[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "netblocktool"
version = "4.0.1"
description = "Discover and rank internet netblocks associated with an organization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "NetblockTool contributors"}]
dependencies = ["httpx>=0.27,<1"]
keywords = ["rdap", "whois", "arin", "ripe", "apnic", "lacnic", "afrinic", "asn", "netblock", "reconnaissance"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: BSD License",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
netblocktool = "netblocktool.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netblocktool"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
